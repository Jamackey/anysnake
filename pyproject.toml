[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anysnake"
version = "0.1.0"
description = "A python library to allow you to play snake on anything!"
readme = "README.md"
authors = [
    { name = "James Mackey"}
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    'numpy',
    'pynput',
]

[project.urls]
Homepage = "https://github.com/Jamackey/anysnake"
Issues = "https://github.com/Jamackey/anysnake/issues"

[tool.hatch.build.targets.wheel]
packages = ["anysnake"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest tests"
